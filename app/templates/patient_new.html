{% extends "base.html" %}
{% block title %}Vitalis — Add Patient{% endblock %}
{% block content %}
<main>
  <h1>Add Patient</h1>
  <form id="patient-form">
    <label for="cnic">CNIC</label>
    <input type="text" id="cnic" name="cnic" placeholder="12345-1234567-1" required>

    <label for="full_name">Full name</label>
    <input type="text" id="full_name" name="full_name" required>

    <label for="date_of_birth">Date of birth</label>
    <input type="date" id="date_of_birth" name="date_of_birth" required>

    <label for="gender">Gender</label>
    <select id="gender" name="gender" required>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select>

    <label for="blood_group">Blood group</label>
    <input type="text" id="blood_group" name="blood_group" placeholder="e.g. O+">

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">

    <label for="address">Address</label>
    <input type="text" id="address" name="address">

    <label>
      <input type="checkbox" id="consent_sharing" name="consent_sharing" checked>
      Patient consents to sharing this record across facilities
    </label>

    <button type="submit">Create patient</button>
    <p id="patient-error" class="form-error" hidden></p>
  </form>
</main>
<script>
  document.getElementById("patient-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const errorEl = document.getElementById("patient-error");
    errorEl.hidden = true;

    const payload = {
      cnic: document.getElementById("cnic").value,
      full_name: document.getElementById("full_name").value,
      date_of_birth: document.getElementById("date_of_birth").value,
      gender: document.getElementById("gender").value,
      blood_group: document.getElementById("blood_group").value || null,
      phone: document.getElementById("phone").value || null,
      address: document.getElementById("address").value || null,
      consent_sharing: document.getElementById("consent_sharing").checked,
    };

    const res = await fetch("/patients", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });

    if (res.ok) {
      const data = await res.json();
      window.location.href = `/patients/${data.id}`;
    } else {
      const data = await res.json();
      errorEl.textContent = typeof data.detail === "string"
        ? data.detail
        : "Please check the form (CNIC must look like 12345-1234567-1).";
      errorEl.hidden = false;
    }
  });
</script>
{% endblock %}
